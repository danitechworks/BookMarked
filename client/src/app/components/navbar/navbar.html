<nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand"
       routerLink="/"
       aria-label="BookMarked home"
       (click)="closeMenu()">
      <span class="brand-wordmark" aria-hidden="true">
        <span class="brand-wordmark__book">Book</span>
        <span class="brand-wordmark__marked">
          Marked
        </span>
      </span>
    </a>

    <button type="button"
            class="navbar-toggler"
            aria-label="Toggle navigation"
            aria-controls="mainNavigation"
            [attr.aria-expanded]="menuOpen"
            (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div id="mainNavigation"
         class="collapse navbar-collapse"
         [class.show]="menuOpen">
      @if (isLoggedIn) {
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item">
          <a class="nav-link"
             routerLink="/"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: true }"
             (click)="closeMenu()">
            <i class="fa-solid fa-book me-1"></i>
            Books
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             routerLink="/quotes"
             routerLinkActive="active"
             (click)="closeMenu()">
            <i class="fa-solid fa-quote-left me-1"></i>
            My Quotes
          </a>
        </li>
      </ul>
      } @else {
      <ul class="navbar-nav me-auto mb-2 mb-md-0">
        <li class="nav-item">
          <a class="nav-link"
             routerLink="/login"
             routerLinkActive="active"
             (click)="closeMenu()">
            <i class="fa-solid fa-right-to-bracket me-1"></i>
            Login
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link"
             routerLink="/register"
             routerLinkActive="active"
             (click)="closeMenu()">
            <i class="fa-solid fa-user-plus me-1"></i>
            Register
          </a>
        </li>
      </ul>
      }
      <button type="button"
              class="btn btn-outline-light me-2"
              (click)="toggleTheme()"
              [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
              [title]="isDarkMode ? 'Light mode' : 'Dark mode'">
        <i class="fa-solid"
           [class.fa-sun]="isDarkMode"
           [class.fa-moon]="!isDarkMode">
        </i>
      </button>
      @if (isLoggedIn) {
      <button type="button"
              class="btn btn-outline-light"
              (click)="logout()">
        <i class="fa-solid fa-right-from-bracket me-1"></i>
        Log out
      </button>
      }
    </div>
  </div>
</nav>
