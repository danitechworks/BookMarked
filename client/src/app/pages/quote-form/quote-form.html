<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 mb-4">Add New Quote</h1>

          @if (errorMessage) {
          <div class="alert alert-danger">
            {{ errorMessage }}
          </div>
          }

          <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="text" class="form-label">Quote</label>

              <textarea id="text"
                        class="form-control"
                        formControlName="text"
                        rows="4"
                        placeholder="Enter your favorite quote"></textarea>

              @if (
              quoteForm.controls.text.touched &&
              quoteForm.controls.text.invalid
              ) {
              <div class="text-danger mt-1">
                Quote text is required.
              </div>
              }
            </div>

            <div class="mb-4">
              <label for="author" class="form-label">Author</label>

              <input id="author"
                     type="text"
                     class="form-control"
                     formControlName="author"
                     placeholder="Enter the author's name" />

              @if (
              quoteForm.controls.author.touched &&
              quoteForm.controls.author.invalid
              ) {
              <div class="text-danger mt-1">
                Author is required.
              </div>
              }
            </div>

            <div class="d-flex gap-2">
              <button type="submit"
                      class="btn btn-primary"
                      [disabled]="isSubmitting">
                <i class="fa-solid fa-floppy-disk me-1"></i>
                {{ isSubmitting ? 'Saving...' : 'Save Quote' }}
              </button>

              <a routerLink="/quotes" class="btn btn-outline-secondary">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
